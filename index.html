<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Fonts: Barlow Condensed (heavy headlines) + JetBrains Mono (code/body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Primary Meta -->
    <title>BOSSROD — Digital Ecosystem</title>
    <meta name="description" content="bossrod.com — builds things. ships code. bad at interviews." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bossrod.com/" />
    <meta property="og:title" content="BOSSROD — Digital Ecosystem" />
    <meta property="og:description" content="bossrod.com — builds things. ships code. bad at interviews." />

    <!-- Canonical & SEO -->
    <link rel="canonical" href="https://bossrod.com/" />

    <!-- Google AdSense Verification & Auto-Ads Tag -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2774195813326441"
      crossorigin="anonymous"
    ></script>

    <!-- Structured Data (JSON-LD): WebSite Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "BOSSROD",
        "url": "https://bossrod.com/",
        "description": "Digital ecosystem and developer portal showcasing web applications, cloud architectures, and interactive digital projects.",
        "publisher": {
          "@type": "Person",
          "name": "Rod Dan"
        }
      }
    </script>

    <!-- Security & Theme -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#0a0a0a" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
